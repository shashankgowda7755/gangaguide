# Checks only: typecheck, build, tests, structured data, browser QA (axe + overflow).
# No deploy here: Vercel builds production from main, and merging is the owner's call.
name: CI
on:
  pull_request:
  push:
    branches: [main, "rebuild/**", "preview/**"]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: http://127.0.0.1:4870
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Build (client, SSR, prerender)
        run: npm run build
      - name: Tests
        run: npm test
      - name: Structured data vs schema.org
        run: node scripts/schema-check.mjs
      - name: Browser QA (axe WCAG 2.2 AA, overflow 320-768, console, status)
        run: |
          npm i --no-save playwright@1.49.1
          PORT=4870 npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4870/api/health && break; sleep 1; done
          SHOTS=qa-shots node scripts/qa.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-shots
          path: qa-shots/
          retention-days: 7
